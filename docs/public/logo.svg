    <!-- Left Arrow -->
    <path d="M 28 50 L 34 50 M 28 50 L 31 47 M 28 50 L 31 53" stroke="#FFD700" stroke-width="3" stroke-linecap="round"
      fill="none" />
    <!-- Right Arrow -->

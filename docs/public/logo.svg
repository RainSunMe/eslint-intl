      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" />

  <!-- ESLint Shield Base -->
  <path d="M 64 22 L 90 36 L 90 64 L 64 78 L 38 64 L 38 36 Z" fill="#4338CA" opacity="0.3" />

  <!-- Globe Structure -->
  <circle cx="64" cy="64" r="32" fill="none" stroke="white" stroke-width="3.5" opacity="0.95" />

  <!-- Meridian Lines -->
  <ellipse cx="64" cy="64" rx="14" ry="32" fill="none" stroke="white" stroke-width="2.5" opacity="0.85" />
  <ellipse cx="64" cy="64" rx="32" ry="16" fill="none" stroke="white" stroke-width="2.5" opacity="0.85" />

  <!-- Center Hexagon (ESLint symbol) -->
